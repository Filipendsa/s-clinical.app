<div class="landing-container">
    <app-toolbar></app-toolbar>
    <div class="page-content-wrapper">
        <p-breadcrumb [model]="breadcrumbItems"
                      [home]="{ icon: 'pi pi-home', routerLink: '/' }"></p-breadcrumb>
        <div class="page-content">
            <p-card>

                <ng-template pTemplate="title">
                    Gestão de Pacientes
                </ng-template>

                <ng-template pTemplate="subtitle">
                    Aqui você pode gerenciar, adicionar, editar ou remover
                    o cadastro de pacientes.
                </ng-template>

                <div class="toolbar-wrapper">
                    <p-button label="Novo Paciente"
                              icon="pi pi-plus"
                              (click)="openFormModal()">
                    </p-button>
                </div>

                <p-table [value]="patients() || []"
                         [paginator]="true"
                         [rows]="10"
                         [tableStyle]="{'min-width': '50rem'}"
                         styleClass="p-datatable-striped">

                    <ng-template pTemplate="header">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Email</th>
                            <th>Gênero</th>
                            <th style="width: 10rem">Ações</th>
                        </tr>
                    </ng-template>

                    <ng-template pTemplate="body"
                                 let-patient>
                        <tr>
                            <td>#{{patient.id}}</td>
                            <td>{{patient.name}}</td>
                            <td>{{patient.phoneNumber}}</td>
                            <td>{{patient.email}}</td>
                            <td>
                                <p-tag [value]="formatGender(patient.gender)"
                                       severity="info"></p-tag>
                            </td>
                            <td>
                                <p-button icon="pi pi-pencil"
                                          styleClass="p-button-text p-button-rounded"
                                          (click)="openFormModal(patient.id)">
                                </p-button>
                                <p-button icon="pi pi-trash"
                                          styleClass="p-button-text p-button-rounded p-button-danger"
                                          (click)="deletePatient(patient.id)">
                                </p-button>
                            </td>
                        </tr>
                    </ng-template>

                    <ng-template pTemplate="emptymessage">
                        <tr>
                            <td colspan="6">Nenhum paciente encontrado.</td>
                        </tr>
                    </ng-template>
                </p-table>

            </p-card>
        </div>
    </div>
</div>
<p-toast />
<p-confirmdialog />
